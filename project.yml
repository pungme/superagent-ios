name: SuperAgent
options:
  bundleIdPrefix: dev.superagent
  deploymentTarget:
    # 26.0 deliberately. The app is a companion to a Mac app that ships to
    # people who update, and the whole UI is built on APIs that landed in 26 —
    # holding a lower floor meant availability guards around things the design
    # depends on rather than a wider audience.
    iOS: "26.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: TNNFV3EQZN   # set your own team id to build for a device
targets:
  SuperAgent:
    type: application
    platform: iOS
    sources:
      - SuperAgent/Sources
      - SuperAgent/Resources
      # The inbox store is shared with the share extension — one file, no
      # framework, because its only dependency is Foundation.
      - path: SuperAgentShare/ShareInbox.swift
    info:
      path: SuperAgent/Info.plist
      properties:
        CFBundleDisplayName: Superagent
        UILaunchScreen:
          UIColorName: LaunchBackground
        # The phone stays portrait: a landscape chat is a keyboard and two lines
        # of transcript. The iPad is the opposite — it is held either way, and
        # the split layout only makes sense with the room.
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: Superagent uses the camera only to scan the pairing code shown on your Mac.
        NSMicrophoneUsageDescription: Superagent listens only while you hold the microphone button, to dictate a message.
        NSSpeechRecognitionUsageDescription: Your dictation is transcribed on this device when possible, so you can review it before sending.
        UIUserInterfaceStyle: Automatic
        CFBundleURLTypes:
          - CFBundleURLName: dev.superagent.pair
            CFBundleURLSchemes: [superagent]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.pungme.superagent.ios
        # Renamed in Xcode; kept here so `xcodegen generate` doesn't undo it.
        PRODUCT_NAME: SuperAgent - Companion
        # The Swift module keeps its name; only the .app on disk is renamed.
        PRODUCT_MODULE_NAME: SuperAgent
        CODE_SIGN_ENTITLEMENTS: SuperAgent/SuperAgent.entitlements
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # The colour variants of the icon, generated into Assets.xcassets and
        # switched with setAlternateIconName. This HAS to live here: the
        # .xcodeproj is regenerated from this file by ci_post_clone.sh, so a
        # setting added only to the local pbxproj ships to nobody.
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: AppIconPink AppIconViolet AppIconBlue AppIconTeal AppIconGreen AppIconAmber
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        ENABLE_PREVIEWS: YES
        SWIFT_STRICT_CONCURRENCY: complete
    dependencies:
      - target: SuperAgentShare
        embed: true
  # The share sheet's "Superagent" row. It writes to the app-group inbox and
  # nothing else; the app does the deciding. See ShareInbox.swift.
  SuperAgentShare:
    type: app-extension
    platform: iOS
    sources:
      - SuperAgentShare
    info:
      path: SuperAgentShare/Info.plist
      properties:
        CFBundleDisplayName: Superagent
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsImageWithMaxCount: 4
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.pungme.superagent.ios.share
        PRODUCT_NAME: SuperAgentShare
        CODE_SIGN_ENTITLEMENTS: SuperAgentShare/SuperAgentShare.entitlements
  SuperAgentTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - SuperAgentTests
      # The wire-format fixtures are owned by the desktop repo and copied here
      # (`make fixtures`) so a clone of this repo alone — Xcode Cloud — builds.
      - path: SuperAgentTests/Fixtures
        buildPhase: resources
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        # The app's product is renamed above; the test host must follow it.
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/SuperAgent - Companion.app/SuperAgent - Companion"
        BUNDLE_LOADER: "$(TEST_HOST)"
    dependencies:
      - target: SuperAgent
  # Taps. The unit tests cover rules; this covers the app answering a finger —
  # which is the only way to check the split layout, since a simulator's touch
  # injection is not reliably available from outside the process.
  SuperAgentUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - SuperAgentUITests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: SuperAgent
    dependencies:
      - target: SuperAgent
schemes:
  SuperAgent:
    build:
      targets:
        SuperAgent: all
        SuperAgentTests: [test]
        SuperAgentUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets: [SuperAgentTests, SuperAgentUITests]
