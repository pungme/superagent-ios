name: SuperAgent
options:
  bundleIdPrefix: dev.superagent
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""   # set your Apple Developer team ID here (or in Xcode → Signing)
targets:
  SuperAgent:
    type: application
    platform: iOS
    sources:
      - SuperAgent/Sources
      - SuperAgent/Resources
    info:
      path: SuperAgent/Info.plist
      properties:
        CFBundleDisplayName: SuperAgent
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.superagent.ios
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        ENABLE_PREVIEWS: YES
        SWIFT_STRICT_CONCURRENCY: complete
  SuperAgentTests:
    type: bundle.unit-test
    platform: iOS
    sources: [SuperAgentTests]
    dependencies:
      - target: SuperAgent
schemes:
  SuperAgent:
    build:
      targets:
        SuperAgent: all
        SuperAgentTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets: [SuperAgentTests]
