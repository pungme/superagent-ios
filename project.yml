name: SuperAgent
options:
  bundleIdPrefix: dev.superagent
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: TNNFV3EQZN   # set your own team id to build for a device
targets:
  SuperAgent:
    type: application
    platform: iOS
    sources:
      - SuperAgent/Sources
      - SuperAgent/Resources
    info:
      path: SuperAgent/Info.plist
      properties:
        CFBundleDisplayName: SuperAgent
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: SuperAgent uses the camera only to scan the pairing code shown on your Mac.
        NSMicrophoneUsageDescription: SuperAgent listens only while you hold the microphone button, to dictate a message.
        NSSpeechRecognitionUsageDescription: Your dictation is transcribed on this device when possible, so you can review it before sending.
        UIUserInterfaceStyle: Automatic
        CFBundleURLTypes:
          - CFBundleURLName: dev.superagent.pair
            CFBundleURLSchemes: [superagent]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.pungme.superagent.ios
        # Renamed in Xcode; kept here so `xcodegen generate` doesn't undo it.
        PRODUCT_NAME: SuperAgent - Companion
        # The Swift module keeps its name; only the .app on disk is renamed.
        PRODUCT_MODULE_NAME: SuperAgent
        CODE_SIGN_ENTITLEMENTS: SuperAgent/SuperAgent.entitlements
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        ENABLE_PREVIEWS: YES
        SWIFT_STRICT_CONCURRENCY: complete
  SuperAgentTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - SuperAgentTests
      # The wire-format fixtures are owned by the desktop repo and copied here
      # (`make fixtures`) so a clone of this repo alone — Xcode Cloud — builds.
      - path: SuperAgentTests/Fixtures
        buildPhase: resources
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        # The app's product is renamed above; the test host must follow it.
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/SuperAgent - Companion.app/SuperAgent - Companion"
        BUNDLE_LOADER: "$(TEST_HOST)"
    dependencies:
      - target: SuperAgent
schemes:
  SuperAgent:
    build:
      targets:
        SuperAgent: all
        SuperAgentTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets: [SuperAgentTests]
